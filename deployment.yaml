apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-portal-deployment
  labels:
    app: food-portal
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurfill: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: food-portal
  template:
    metadata:
      labels:
        app: food-portal
    spec:
      containers:
      - name: food-portal
        image: yogaprasath77/food-portal:v2
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: food-portal-service
spec:
  type: NodePort
  selector:
    app: food-portal
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
